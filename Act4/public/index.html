<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Paddock Pro | Ultimate Manager</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        
        select {
            padding: 14px;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        select:focus { border-color: var(--primary-red); }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-grid input, .form-grid select, .form-grid button {
            width: 100%;
            margin: 0;
            box-sizing: border-box;
        }
        .btn-grid { grid-column: span 2; }
    </style>
</head>
<body>

    <div id="authSection" class="glass-panel">
        <h1>F1 Paddock</h1>
        <h2>Acceso VIP</h2>
        <form id="authForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Usuario / Piloto" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Contraseña de Telemetría" required>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">Iniciar Sesión</button>
            <button type="button" class="btn btn-secondary" id="registerBtn">Registrar Credenciales</button>
        </form>
        <div id="message"></div>
    </div>

    <div id="dashboardSection" class="glass-panel hidden" style="max-width: 800px;">
        <h1>Centro de Comando</h1>
        <h2>Gestión de Pilotos</h2>
        
        <form id="pilotoForm" class="form-grid">
            <input type="text" id="nombrePiloto" placeholder="Nombre del Piloto" required>
            <input type="text" id="escuderiaPiloto" placeholder="Escudería (Ej. Ferrari)" required>
            
            <input type="number" id="numeroPiloto" placeholder="Número (1-99)" min="1" max="99" required>
            
            <input type="number" id="titulosPiloto" placeholder="Títulos Mundiales" min="0" required>
            <select id="estadoPiloto" required>
                <option value="Activo">Estado: Activo</option>
                <option value="Retirado">Estado: Retirado</option>
            </select>
            
            <button type="submit" class="btn btn-primary btn-grid">Agregar a la Parrilla</button>
        </form>

        <table class="f1-table">
            <thead>
                <tr>
                    <th>Piloto</th>
                    <th>Escudería</th>
                    <th>N°</th>
                    <th>Títulos</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="pilotosList">
                </tbody>
        </table>
        
        <button id="logoutBtn" class="btn btn-secondary" style="margin-top: 20px;">Cerrar Sesión</button>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
