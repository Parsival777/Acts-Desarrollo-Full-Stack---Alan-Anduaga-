name: CI/CD Node.js

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Usar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Instalar dependencias
      run: npm install
    - name: Ejecutar pruebas
      run: npm test
